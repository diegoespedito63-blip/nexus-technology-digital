<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teste de Pagamento · Nexus Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // Cole aqui o ID do pixel para medir a venda (opcional no teste)
  const PIXEL_ID = '';
</script>

<style>
  :root{--bg:#06070d;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.08);--text:#f3f5fa;--muted:#9aa3b8;
        --c1:#22e57a;--c2:#22d3ee;--c3:#7c5cff;--grad:linear-gradient(100deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 110%)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,rgba(124,92,255,.18),transparent),var(--bg);
       color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 28px;backdrop-filter:blur(10px)}
  .tag{display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#06070d;background:var(--grad);padding:5px 12px;border-radius:999px;font-weight:600}
  h1{font:800 1.8rem Outfit,sans-serif;margin:16px 0 8px}
  p{color:var(--muted)}
  .item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:24px 0 18px}
  .item strong{font:700 1.4rem Outfit,sans-serif}
  .btn{width:100%;border:0;border-radius:14px;padding:16px;font:700 1rem Outfit,sans-serif;color:#06070d;background:var(--grad);cursor:pointer;transition:transform .2s,opacity .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.5;cursor:wait;transform:none}
  .note{font-size:.82rem;margin-top:14px;text-align:center}
  .msg{display:none;margin-top:18px;border-radius:14px;padding:16px 18px;font-size:.95rem}
  .msg.ok{display:block;background:rgba(34,229,122,.1);border:1px solid rgba(34,229,122,.4);color:#b8f7d3}
  .msg.warn{display:block;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.35);color:#fde68a}
  .msg.err{display:block;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);color:#fecaca}
  .msg small{display:block;color:var(--muted);margin-top:6px}
  a{color:var(--c2)}
</style>
</head>
<body>
  <main class="card">
    <span class="tag">Modo de teste</span>
    <h1>Teste de pagamento</h1>
    <p>Página para testar o pagamento com cartão pelo Mercado Pago. Nenhum valor real é cobrado com as credenciais de teste.</p>

    <div class="item"><span>Pagamento de teste</span><strong id="valor">R$ 10,00</strong></div>
    <button class="btn" id="pagar">Pagar com cartão</button>
    <p class="note">🔒 Pagamento processado pelo Mercado Pago</p>

    <div class="msg" id="msg"></div>
    <p class="note"><a href="/">← Voltar ao site</a></p>
  </main>

<script>
const msg = document.getElementById('msg');
function aviso(tipo, html){ msg.className = 'msg ' + tipo; msg.innerHTML = html; }

/* ---------- Pixel (opcional) ---------- */
if(PIXEL_ID){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID); fbq('track', 'PageView');
}

/* ---------- Botão: cria a cobrança e vai para o Mercado Pago ---------- */
const btn = document.getElementById('pagar');
btn.onclick = async () => {
  btn.disabled = true; btn.textContent = 'Abrindo pagamento…';
  try{
    const r = await fetch('/api/checkout', { method:'POST' });
    const d = await r.json();
    if(!r.ok || !d.url) throw new Error(d.erro || 'Erro ao criar pagamento');
    if(window.fbq) fbq('track', 'InitiateCheckout', { value: d.valor, currency: 'BRL' });
    location.href = d.url;
  }catch(e){
    aviso('err', `Não foi possível abrir o pagamento.<small>${e.message}</small>`);
    btn.disabled = false; btn.textContent = 'Pagar com cartão';
  }
};

/* ---------- Retorno do Mercado Pago ---------- */
const q = new URLSearchParams(location.search);
const status = q.get('collection_status') || q.get('status');
const pagamentoId = q.get('payment_id') || q.get('collection_id');

if(status === 'approved'){
  aviso('ok', `✅ Pagamento aprovado!<small>Nº do pagamento: ${pagamentoId || '-'}</small>`);
  // conta a venda uma vez só, mesmo se a página for recarregada
  let jaContou = false;
  try{ jaContou = sessionStorage.getItem('pago_' + pagamentoId) === '1'; sessionStorage.setItem('pago_' + pagamentoId, '1'); }catch(e){}
  if(!jaContou){
    if(window.fbq) fbq('track', 'Purchase', { value: 10, currency: 'BRL' }, { eventID: 'mp_' + pagamentoId });
    console.log('[pixel] Purchase R$ 10' + (window.fbq ? '' : ' (pixel não configurado)'));
  }
}else if(status === 'pending' || status === 'in_process'){
  aviso('warn', '⏳ Pagamento em análise. Assim que for aprovado, você recebe a confirmação.');
}else if(status === 'rejected'){
  aviso('err', '❌ Pagamento recusado. Tente novamente com outro cartão.');
}else if(status === 'null'){
  aviso('warn', 'Pagamento não concluído. Você pode tentar de novo quando quiser.');
}
</script>
</body>
</html>
